format = """
[ ](bg:#293d29)\
[ ](bg:#293d29 fg:#E8F5E9)\
$username\
[ ](bg:#426342 fg:#E8F5E9)\
$directory\
$git_branch\
$git_status\
$c\
$golang\
$java\
$nodejs\
$python\
$rust\
$time\
$fill\
$cmd_duration\
$hostname
$character"""

# Disable the blank line at the start of the prompt
add_newline = false

# You can also replace your username with a neat symbol like   or disable this
# and use the os module below
[username]
show_always = true
style_user = "fg:#E8F5E9 bg:#293d29"
style_root = "fg:#E8F5E9 bg:#293d29"
format = '[$user ](bold $style)'
disabled = false

[cmd_duration]
min_time = 1
format = 'took [$duration](bold #81C784) on'

[character]
success_symbol = '[➜](bold #FFFFFF) '
error_symbol = '[➜](bold #FFFFFF) '

[hostname]
ssh_only = false
format = ' [$hostname](#A5D6A7) '
disabled = false

# An alternative to the username module which displays a symbol that
# represents the current operating system
[os]
style = "bg:#293d29"
disabled = true      # Disabled by default

[directory]
style = "fg:#E8F5E9 bg:#426342"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

# Here is how you can shorten some long paths by text replacement
# similar to mapped_locations in Oh My Posh:
[directory.substitutions]
"Documents" = " "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
# Keep in mind that the order matters. For example:
# "Important Documents" = "  "
# will not be replaced, because "Documents" was already substituted before.
# So either put "Important Documents" before "Documents" or use the substituted version:
# "Important  " = "  "

[fill]
symbol = ' '

[c]
symbol = ""
style = "fg:#1B5E20 bg:#A8D5BA"
format = '[ $symbol ]($style)'

[docker_context]
symbol = " "
style = "fg:#1B5E20 bg:#A8D5BA"
format = '[ $symbol $context ]($style) $path'

[git_branch]
symbol = ""
style = "fg:#E8F5E9 bg:#426342"
format = '[ $symbol $branch ]($style)'


[git_status]
style = "fg:#E8F5E9 bg:#426342"
conflicted = "🏳"
up_to_date = " "
untracked = " "
ahead = "⇡${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
behind = "⇣${count}"
stashed = ""
modified = " "
staged = '[++\($count\)](fg:#E8F5E9 bg:#426342)'
renamed = "襁"
deleted = " "
format = '[$all_status$ahead_behind](bold $style)'

[golang]
symbol = "go"
style = "fg:#1B5E20 bg:#A8D5BA"
format = '[ $symbol ]($style)'

[java]
symbol = ""
style = "fg:#1B5E20 bg:#A8D5BA"
format = '[ $symbol ]($style)'

[nodejs]
symbol = ""
style = "fg:#1B5E20 bg:#A8D5BA"
format = '[ $symbol ]($style)'

[python]
# Display the version of python from inside a local venv.
#
# Note this will only work when the venv is inside the project and it will only
# work in the directory that contains the venv dir but maybe this is ok?
# The (\($virtualenv\)) conditional group renders "(venv_name)" only when a
# venv is active (VIRTUAL_ENV is set), matching bash's default PS1 prefix.
symbol = ''
style = "fg:#1B5E20 bg:#A8D5BA"
format = '[ $symbol (\($virtualenv\)) ]($style)'

[rust]
symbol = ""
style = "fg:#1B5E20 bg:#A8D5BA"
format = '[ $symbol ]($style)'

[time]
disabled = false
time_format = "%R"              # Hour:Minute Format
style = "fg:#1B5E20 bg:#C8E6C9"
format = '[  $time ]($style)'
