# Classic Bash-style Starship Configuration
format = """$python$username$hostname:$directory$git_branch$git_status$character"""

# Disable blank line at start of prompt
add_newline = false

[username]
show_always = true
style_user = "bold green"
style_root = "bold red"
format = "[$user]($style)"
disabled = false

[hostname]
ssh_only = false
style = "bold green"
format = "[@$hostname]($style)"
disabled = false

[directory]
style = "bold blue"
format = "[$path]($style)"
truncation_length = 0
truncate_to_repo = false

[character]
success_symbol = "[\\$](bold green) "
error_symbol = "[\\$](bold red) "

[git_branch]
style = "bold cyan"
format = ' [(\($branch\))]($style)'

[git_status]
style = "bold yellow"
format = '([$all_status$ahead_behind]($style))'
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?"
modified = "*"
staged = "+"
renamed = "»"
deleted = "✘"

[python]
style = "bold yellow"
format = '[(\($virtualenv\) )]($style)'
